name: soft_khata_flutter
description: Soft Khata - Digital business ledger

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.0.10
  otp_text_field: ^1.1.3
  http: ^1.2.2
  equatable: ^2.0.5
  flutter_spinkit: ^5.2.1
  shared_preferences: ^2.3.2
  prefs: ^3.3.0
  dartz: ^0.10.1
  intl: ^0.19.0
  flutter_bloc: ^8.1.6
  provider: ^6.1.2
  fl_chart: ^0.69.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Bold
      fonts:
        - asset: assets/fonts/JosefinSans-Bold.ttf
    - family: SemiBold
      fonts:
        - asset: assets/fonts/JosefinSans-SemiBold.ttf
    - family: Medium
      fonts:
        - asset: assets/fonts/JosefinSans-Medium.ttf
    - family: Regular
      fonts:
        - asset: assets/fonts/JosefinSans-Regular.ttf
    - family: Light
      fonts:
        - asset: assets/fonts/JosefinSans-Light.ttf
    - family: Thin
      fonts:
        - asset: assets/fonts/JosefinSans-Thin.ttf
